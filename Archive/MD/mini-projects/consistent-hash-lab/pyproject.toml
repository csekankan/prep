[project]
name = "consistent-hash-lab"
version = "0.1.0"
description = "Consistent hashing ring with virtual nodes — fanout partitioning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consistent_hash_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
