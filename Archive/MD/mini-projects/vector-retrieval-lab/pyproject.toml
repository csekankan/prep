[project]
name = "vector-retrieval-lab"
version = "0.1.0"
description = "Brute-force vs IVF vector search — companion to embeddings-and-retrieval MD."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26.0", "rich>=13.0.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_retrieval_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
