[project]
name = "spark-batch-lab"
version = "0.1.0"
description = "Spark-style lazy DAG, narrow/wide ops, shuffle and skew salt."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_batch_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
