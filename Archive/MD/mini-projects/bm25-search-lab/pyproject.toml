[project]
name = "bm25-search-lab"
version = "0.1.0"
description = "BM25 lexical search — fanout search module."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bm25_search_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
