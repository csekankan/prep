[project]
name = "agent-tool-loop-lab"
version = "0.1.0"
description = "Agent observe-think-act loop with tool registry (MCP-style)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "rich>=13.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tool_loop_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
