[project]
name = "transaction-outbox-lab"
version = "0.1.0"
description = "Transactional outbox pattern — reliable event publish."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transaction_outbox_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
