[project]
name = "idempotency-api-lab"
version = "0.1.0"
description = "Stripe-style idempotency keys with FastAPI — production patterns."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idempotency_api_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
