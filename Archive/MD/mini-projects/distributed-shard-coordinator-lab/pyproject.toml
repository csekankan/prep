[project]
name = "distributed-shard-coordinator-lab"
version = "0.1.0"
description = "Consistent-hash sharding with Dynamo-style quorum R/W, failover, and hinted handoff."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distributed_shard_coordinator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
