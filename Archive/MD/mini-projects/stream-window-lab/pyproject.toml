[project]
name = "stream-window-lab"
version = "0.1.0"
description = "Event-time tumbling windows, watermarks, and late events (Flink concepts)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_window_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
