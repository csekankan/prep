[project]
name = "analytics-sketches-lab"
version = "0.1.0"
description = "HyperLogLog and Count-Min sketch — fanout analytics module."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_sketches_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
