[project]
name = "kv-transformer-lab"
version = "0.1.0"
description = "Heavily commented NumPy labs for transformers, KV cache, and serving capacity math."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kv_transformer_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
