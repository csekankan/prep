[project]
name = "bloom-filter-lab"
version = "0.1.0"
description = "Bloom filter for membership tests — fanout partitioning module."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bloom_filter_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
